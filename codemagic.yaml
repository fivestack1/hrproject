workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: CM Key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.insightshoroscope.astrology

      vars:
        XCODE_PROJECT: "MyHoroscope2.xcodeproj"
        XCODE_SCHEME: "MyHoroscope2"
        APP_STORE_APPLE_ID: "6816404624"

      xcode: 26.3
      cocoapods: default

    triggering:
      events:
        - push
        - tag
        - pull_request

      branch_patterns:
        - pattern: 'develop'
          include: true
          source: true

    scripts:
      - name: Diagnose signing
        script: |
          echo "=== XCODE PROJECT ==="
          ls -la "$CM_BUILD_DIR/MyHoroscope2.xcodeproj"

          echo "=== PROJECT TARGETS ==="
          xcodebuild -project "$CM_BUILD_DIR/MyHoroscope2.xcodeproj" -list

          echo "=== BUNDLE IDENTIFIERS ==="
          xcodebuild \
            -project "$CM_BUILD_DIR/MyHoroscope2.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER'

      - name: Increment build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
